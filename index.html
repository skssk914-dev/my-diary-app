<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 감성 그리드 다이어리</title>
    <style>
        body {
            background-color: #f7f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .app-container {
            width: 360px;
            height: 740px;
            background-color: #ffffff;
            border-radius: 35px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .app-header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 2px dashed #f0f0f0;
            margin-bottom: 15px;
        }
        .app-title { font-size: 18px; font-weight: bold; color: #4a4a4a; }
        .app-subtitle { font-size: 12px; color: #a0a0a0; margin-top: 4px; }

        /* 오늘 일기 쓰기 버튼 (연한 핑크) */
        .write-btn {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.4);
        }

        .write-form {
            display: none;
            background-color: #fffdf9;
            border: 1px solid #f3e9dc;
            padding: 14px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .section-label {
            font-size: 11px;
            font-weight: bold;
            color: #ff69b4;
            margin: 10px 0 4px 0;
        }

        .write-form input, .write-form textarea, .write-form select {
            width: 100%;
            margin-bottom: 6px;
            padding: 7px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 11px;
        }

        .row-flex {
            display: flex;
            gap: 6px;
        }

        .meal-box {
            background-color: #fff5f7;
            border: 1px dashed #ffd1dc;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .meal-title {
            font-size: 11px;
            font-weight: bold;
            color: #db7093;
            margin-bottom: 4px;
        }

        .add-ex-btn {
            background-color: #8d99ae;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .ex-list-box {
            background-color: #f4f6f4;
            border-radius: 8px;
            padding: 6px 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ex-item-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid #e2e8e2;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #4a5d4e;
        }

        .remove-ex {
            color: #e57373;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-left: 6px;
        }

        /* 기록 저장하기 버튼 (핫핑크) */
        .save-btn {
            background-color: #ff1493;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(255, 20, 147, 0.3);
        }

        /* 그리드 카드 영역 */
        .diary-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .grid-card {
            background-color: #fefefd;
            border: 1px solid #f1ece6;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            position: relative;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f7f7f7;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .card-date { font-size: 11px; color: #8c8c8c; font-weight: bold; }
        .card-mood { font-size: 20px; }

        .card-photo {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .card-music { font-size: 11px; color: #6b6b6b; font-weight: bold; margin-bottom: 6px; }
        .card-text { font-size: 12px; color: #333; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; }

        .card-details {
            background-color: #fff9fa;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 11px;
            color: #555;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meal-display-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .meal-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .meal-img {
            width: 100%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 2px;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 10px;
        }
        .action-btn {
            background: none;
            border: 1px solid #ddd;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            color: #777;
            cursor: pointer;
        }
        .delete-btn { color: #e57373; border-color: #ffcdd2; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <div class="app-title">🌿 나의 하루 다이어리</div>
            <div class="app-subtitle">생각, 식단, 운동, 사진 기록하기</div>
        </div>

        <button class="write-btn" onclick="openForm()">✏️ 오늘 일기 쓰기</button>

        <!-- 입력/수정 폼 -->
        <div class="write-form" id="writeForm">
            <input type="hidden" id="editIndex" value="-1">

            <div class="section-label">1. 감정 및 BGM</div>
            <div class="row-flex">
                <select id="moodInput" style="width: 40%;">
                    <option value="☕">☕ 여유로움</option>
                    <option value="🌿">🌿 평온함</option>
                    <option value="😊">😊 기쁨/행복</option>
                    <option value="🌧️">🌧️ 감성/우울</option>
                    <option value="🔥">🔥 열정/열심히</option>
                </select>
                <input type="text" id="musicInput" placeholder="🎵 BGM (곡명)">
            </div>

            <div class="section-label">2. 오늘의 생각 / 추억</div>
            <textarea id="textInput" rows="3" placeholder="일기 내용을 적어보세요..."></textarea>

            <div class="section-label">3. 대표 사진 첨부</div>
            <input type="file" id="photoInput" accept="image/*">

            <div class="section-label">4. 식단 기록 & 식사 사진 첨부 (선택)</div>
            
            <div class="meal-box">
                <div class="meal-title">🥣 아침 식단</div>
                <input type="text" id="breakfastInput" placeholder="메뉴 이름 (예: 사과, 계란)">
                <input type="file" id="breakfastPhotoInput" accept="image/*">
            </div>

            <div class="meal-box">
                <div class="meal-title">🥗 점심 식단</div>
                <input type="text" id="lunchInput" placeholder="메뉴 이름 (예: 비빔밥)">
                <input type="file" id="lunchPhotoInput" accept="image/*">
            </div>

            <div class="meal-box">
                <div class="meal-title">🍲 저녁 식단</div>
                <input type="text" id="dinnerInput" placeholder="메뉴 이름 (예: 닭가슴살 샐러드)">
                <input type="file" id="dinnerPhotoInput" accept="image/*">
            </div>

            <div class="section-label">5. 오늘 했던 운동들 (여러 개 추가 가능)</div>
            <div class="row-flex" style="margin-bottom: 6px;">
                <input type="text" id="exTypeInput" placeholder="종류 (예: 산책)" style="margin-bottom:0;">
                <input type="text" id="exTimeInput" placeholder="시간 (예: 30분)" style="margin-bottom:0;">
                <button type="button" class="add-ex-btn" onclick="addExercise()">+ 추가</button>
            </div>
            
            <div class="ex-list-box" id="exListBox" style="display:none;"></div>

            <button class="save-btn" onclick="saveDiary()">기록 저장하기</button>
        </div>

        <div class="diary-grid" id="diaryGrid"></div>
    </div>

    <script>
        let photoBase64 = "";
        let breakfastPhotoBase64 = "";
        let lunchPhotoBase64 = "";
        let dinnerPhotoBase64 = "";
        let currentExercises = [];

        window.onload = function() {
            loadDiaries();
            setupPhotoHandlers();
        };

        function compressImage(file, callback) {
            if (!file) {
                callback("");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 400;
                    canvas.height = img.height * (400 / img.width);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
            reader.readAsDataURL(file);
        }

        function setupPhotoHandlers() {
            document.getElementById('photoInput').addEventListener('change', e => {
                compressImage(e.target.files[0], res => photoBase64 = res);
            });
            document.getElementById('breakfastPhotoInput').addEventListener('change', e => {
                compressImage(e.target.files[0], res => breakfastPhotoBase64 = res);
            });
            document.getElementById('lunchPhotoInput').addEventListener('change', e => {
                compressImage(e.target.files[0], res => lunchPhotoBase64 = res);
            });
            document.getElementById('dinnerPhotoInput').addEventListener('change', e => {
                compressImage(e.target.files[0], res => dinnerPhotoBase64 = res);
            });
        }

        function addExercise() {
            const typeInput = document.getElementById('exTypeInput');
            const timeInput = document.getElementById('exTimeInput');
            const type = typeInput.value.trim();
            const time = timeInput.value.trim();

            if (!type) {
                alert('운동 종류를 입력해 주세요!');
                return;
            }

            currentExercises.push({ type: type, time: time });
            typeInput.value = '';
            timeInput.value = '';
            renderExerciseList();
        }

        function removeExercise(index) {
            currentExercises.splice(index, 1);
            renderExerciseList();
        }

        function renderExerciseList() {
            const box = document.getElementById('exListBox');
            if (currentExercises.length === 0) {
                box.style.display = 'none';
                box.innerHTML = '';
                return;
            }

            box.style.display = 'flex';
            box.innerHTML = currentExercises.map((ex, idx) => `
                <div class="ex-item-tag">
                    <span>👟 <b>${ex.type}</b> ${ex.time ? '(' + ex.time + ')' : ''}</span>
                    <span class="remove-ex" onclick="removeExercise(${idx})">✕</span>
                </div>
            `).join('');
        }

        function openForm() {
            resetForm();
            document.getElementById('writeForm').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('editIndex').value = "-1";
            document.getElementById('moodInput').value = "☕";
            document.getElementById('musicInput').value = "";
            document.getElementById('textInput').value = "";
            document.getElementById('photoInput').value = "";
            
            document.getElementById('breakfastInput').value = "";
            document.getElementById('breakfastPhotoInput').value = "";
            document.getElementById('lunchInput').value = "";
            document.getElementById('lunchPhotoInput').value = "";
            document.getElementById('dinnerInput').value = "";
            document.getElementById('dinnerPhotoInput').value = "";

            document.getElementById('exTypeInput').value = "";
            document.getElementById('exTimeInput').value = "";
            currentExercises = [];
            renderExerciseList();
            
            photoBase64 = "";
            breakfastPhotoBase64 = "";
            lunchPhotoBase64 = "";
            dinnerPhotoBase64 = "";
        }

        function saveDiary() {
            const editIndex = parseInt(document.getElementById('editIndex').value);
            const text = document.getElementById('textInput').value;

            if (!text.trim()) {
                alert('일기 내용을 입력해 주세요!');
                return;
            }

            let diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];

            const today = new Date();
            const dateStr = (today.getMonth() + 1) + '월 ' + today.getDate() + '일';

            const savedDate = (editIndex > -1) ? diaries[editIndex].date : dateStr;
            const savedPhoto = photoBase64 || ((editIndex > -1) ? diaries[editIndex].photo : "");
            const savedBkPhoto = breakfastPhotoBase64 || ((editIndex > -1) ? diaries[editIndex].breakfastPhoto : "");
            const savedLuPhoto = lunchPhotoBase64 || ((editIndex > -1) ? diaries[editIndex].lunchPhoto : "");
            const savedDnPhoto = dinnerPhotoBase64 || ((editIndex > -1) ? diaries[editIndex].dinnerPhoto : "");

            const diaryData = {
                date: savedDate,
                mood: document.getElementById('moodInput').value,
                music: document.getElementById('musicInput').value,
                text: text,
                photo: savedPhoto,
                breakfast: document.getElementById('breakfastInput').value,
                breakfastPhoto: savedBkPhoto,
                lunch: document.getElementById('lunchInput').value,
                lunchPhoto: savedLuPhoto,
                dinner: document.getElementById('dinnerInput').value,
                dinnerPhoto: savedDnPhoto,
                exercises: currentExercises
            };

            if (editIndex > -1) {
                diaries[editIndex] = diaryData;
            } else {
                diaries.unshift(diaryData);
            }

            localStorage.setItem('myDiaries', JSON.stringify(diaries));
            document.getElementById('writeForm').style.display = 'none';
            resetForm();
            loadDiaries();
        }

        function editDiary(index) {
            let diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
            const item = diaries[index];

            document.getElementById('editIndex').value = index;
            document.getElementById('moodInput').value = item.mood;
            document.getElementById('musicInput').value = item.music || "";
            document.getElementById('textInput').value = item.text || "";
            
            document.getElementById('breakfastInput').value = item.breakfast || "";
            document.getElementById('lunchInput').value = item.lunch || "";
            document.getElementById('dinnerInput').value = item.dinner || "";

            if (item.exercises) {
                currentExercises = [...item.exercises];
            } else if (item.exType) {
                currentExercises = [{ type: item.exType, time: item.exTime || "" }];
            } else {
                currentExercises = [];
            }
            renderExerciseList();

            photoBase64 = item.photo || "";
            breakfastPhotoBase64 = item.breakfastPhoto || "";
            lunchPhotoBase64 = item.lunchPhoto || "";
            dinnerPhotoBase64 = item.dinnerPhoto || "";

            document.getElementById('writeForm').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteDiary(index) {
            if (confirm('이 일기를 정말 삭제하시겠습니까?')) {
                let diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
                diaries.splice(index, 1);
                localStorage.setItem('myDiaries', JSON.stringify(diaries));
                loadDiaries();
            }
        }

        function loadDiaries() {
            const grid = document.getElementById('diaryGrid');
            grid.innerHTML = '';

            let diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];

            if (diaries.length === 0) {
                grid.innerHTML = '<div style="text-align:center; color:#aaa; font-size:12px; padding:30px;">아직 작성된 일기가 없습니다.<br>버튼을 눌러 나만의 첫 일기를 남겨보세요!</div>';
                return;
            }

            diaries.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'grid-card';

                let mealsHTML = '';
                if (item.breakfast || item.breakfastPhoto) {
                    mealsHTML += `<div class="meal-item">🥣 <b>아침:</b> ${item.breakfast || ''} ${item.breakfastPhoto ? `<img src="${item.breakfastPhoto}" class="meal-img">` : ''}</div>`;
                }
                if (item.lunch || item.lunchPhoto) {
                    mealsHTML += `<div class="meal-item">🥗 <b>점심:</b> ${item.lunch || ''} ${item.lunchPhoto ? `<img src="${item.lunchPhoto}" class="meal-img">` : ''}</div>`;
                }
                if (item.dinner || item.dinnerPhoto) {
                    mealsHTML += `<div class="meal-item">🍲 <b>저녁:</b> ${item.dinner || ''} ${item.dinnerPhoto ? `<img src="${item.dinnerPhoto}" class="meal-img">` : ''}</div>`;
                }

                let exerciseHTML = '';
                const exList = item.exercises || (item.exType ? [{ type: item.exType, time: item.exTime }] : []);
                if (exList.length > 0) {
                    exerciseHTML = exList.map(ex => `<div>👟 <b>운동:</b> ${ex.type} ${ex.time ? '(' + ex.time + ')' : ''}</div>`).join('');
                }

                card.innerHTML = `
                    <div class="card-top">
                        <span class="card-date">${item.date}</span>
                        <span class="card-mood">${item.mood}</span>
                    </div>
                    ${item.photo ? `<img src="${item.photo}" class="card-photo">` : ''}
                    ${item.music ? `<div class="card-music">🎵 ${item.music}</div>` : ''}
                    <div class="card-text">${item.text}</div>
                    ${(mealsHTML || exerciseHTML) ? `
                        <div class="card-details">
                            ${mealsHTML ? `<div class="meal-display-box">${mealsHTML}</div>` : ''}
                            ${exerciseHTML}
                        </div>
                    ` : ''}
                    <div class="card-actions">
                        <button class="action-btn" onclick="editDiary(${index})">✏️ 수정</button>
                        <button class="action-btn delete-btn" onclick="deleteDiary(${index})">🗑️ 삭제</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
